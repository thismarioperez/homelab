k3s_version: "v1.36.2+k3s1"
token: "{{ lookup('community.general.onepassword', 'testlab - k3s cluster token', field='password', vault='Home Network') }}"

# tf_output's binary_path option is type: path, so a bare "tofu" resolves
# relative to the playbook's basedir instead of searching $PATH — pass the
# resolved absolute path instead.
tofu_binary_path: "{{ lookup('ansible.builtin.pipe', 'command -v tofu') }}"
k3s_apiserver_vip: "{{ lookup('cloud.terraform.tf_output', 'k3s_apiserver_vip', project_path='../tofu/testlab', binary_path=tofu_binary_path) }}"

# kube-vip fronts the controller(s) with a single floating IP (see
# playbooks/k3s_vip_install.yml). testlab currently runs a single
# controller, so this buys no failover today, but the VIP is kept so
# --tls-san/api_endpoint stay stable if the controller count grows again
# here or in the `lab` cluster this pattern is meant to be reused for.
api_endpoint: "{{ k3s_apiserver_vip }}"

# --tls-san covers the kube-vip VIP in the apiserver's TLS cert, since
# clients (kubectl/helm) connect via the VIP rather than a node's own IP.
# --disable local-storage stops k3s from deploying local-path-provisioner,
# which otherwise registers itself as a second default StorageClass
# alongside Longhorn (kubernetes/testlab/apps/longhorn) and makes default
# PVC binding ambiguous.
extra_server_args: "--tls-san {{ k3s_apiserver_vip }} --disable servicelb --disable local-storage"

kube_vip_version: "v1.2.1"
k3s_kubeconfig_path: /etc/rancher/k3s/k3s.yaml
