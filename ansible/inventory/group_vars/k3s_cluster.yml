k3s_version: "v1.36.2+k3s1"
token: "{{ lookup('community.general.onepassword', 'testlab - k3s cluster token', field='password', vault='Home Network') }}"
api_endpoint: "{{ hostvars[groups['server'][0]]['ansible_host'] | default(groups['server'][0]) }}"

# MetalLB replaces k3s's built-in Klipper servicelb, which just DNAT-forwards
# a node's own IP rather than handing out a dedicated LoadBalancer address.
#
# tf_output's binary_path option is type: path, so a bare "tofu" resolves
# relative to the playbook's basedir instead of searching $PATH — pass the
# resolved absolute path instead.
tofu_binary_path: "{{ lookup('ansible.builtin.pipe', 'command -v tofu') }}"
k3s_lb_ip: "{{ lookup('cloud.terraform.tf_output', 'k3s_lb_ip', project_path='../tofu/testlab', binary_path=tofu_binary_path) }}"
extra_server_args: "--disable servicelb"
metallb_chart_version: "0.16.1"
