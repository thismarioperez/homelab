- name: Bootstrap kube-vip static pod and RBAC on k3s controllers
  hosts: k3s_controllers
  become: true
  tasks:
    - name: Ensure k3s manifest directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /var/lib/rancher/k3s/agent/pod-manifests
        - /var/lib/rancher/k3s/server/manifests

    - name: Render kube-vip static pod manifest
      ansible.builtin.template:
        src: kube-vip-static-pod.yml.j2
        dest: /var/lib/rancher/k3s/agent/pod-manifests/kube-vip.yaml
        mode: "0644"

    - name: Fetch kube-vip RBAC manifest
      ansible.builtin.get_url:
        url: https://kube-vip.io/manifests/rbac.yaml
        dest: /var/lib/rancher/k3s/server/manifests/kube-vip-rbac.yaml
        mode: "0644"
