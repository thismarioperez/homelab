- name: Wait for hosts to be ready for Ansible
  ansible.builtin.import_playbook: wait_for_ready.yml

- name: Full upgrade apt packages
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Full-upgrade apt packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: full
        autoremove: true
        autoclean: true

    - name: Check if a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot if required
      ansible.builtin.reboot:
        reboot_timeout: 600
      when: reboot_required.stat.exists
