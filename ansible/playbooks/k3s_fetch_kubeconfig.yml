- name: Fetch kubeconfig to the control node
  hosts: k3s_controllers[0]
  become: true
  gather_facts: false
  tasks:
    - name: Fetch kubeconfig from the controller
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ playbook_dir }}/../.cache/testlab-kubeconfig.yaml"
        flat: true

- name: Point kubeconfig at the kube-vip apiserver VIP
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    api_endpoint: "{{ hostvars[groups['k3s_controllers'][0]]['k3s_apiserver_vip'] }}"
  tasks:
    # k3s writes the kubeconfig pointing at 127.0.0.1, which only resolves
    # on the controller itself; point it at the kube-vip VIP instead so it
    # keeps working from the operator's own machine.
    - name: Point kubeconfig at the kube-vip apiserver VIP
      ansible.builtin.replace:
        path: "{{ playbook_dir }}/../.cache/testlab-kubeconfig.yaml"
        regexp: 'https://127\.0\.0\.1:6443'
        replace: "https://{{ api_endpoint }}:6443"
