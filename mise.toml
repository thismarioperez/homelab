[env]
_.file = ".env"

[tools]
opentofu = "1.12"
kubectl = "1.36"
kubeconform = "latest"
helm = "3"
1password-cli = "latest"
python = "3"
pipx = "latest"
"pipx:ansible" = { version = "14", pipx_args = "--include-deps" }
"pipx:ansible-lint" = "26"
"pipx:yamllint" = "latest"

[tasks."op:whoami"]
description = "test that OP_SERVICE_ACCOUNT_TOKEN auth works"
run = "op whoami"

[tasks."op:read"]
description = "read a secret from 1Password, e.g. mise run op:read -- op://vault/item/field"
run = "op read"

[tasks."ssh:add-key"]
description = "load the 1Password management ssh key into ssh-agent"
run = "op read 'op://Home Network/theforce - management ssh key/private key?ssh-format=openssh' | ssh-add -"

[tasks."ansible:install-collections"]
description = "install ansible collections required by ansible/requirements.yml"
dir = "{{config_root}}/ansible"
run = "ansible-galaxy collection install -r requirements.yml"

[tasks."ansible:lint"]
description = "lint ansible playbooks and roles with ansible-lint"
dir = "{{config_root}}/ansible"
run = "ansible-lint"

[tasks."ansible:yamllint"]
description = "check ansible yaml formatting with yamllint"
dir = "{{config_root}}/ansible"
run = "yamllint ."

[tasks."ansible:check"]
description = "check formatting and validity of ansible playbooks and roles"
depends = [
  "ansible:yamllint",
  "ansible:lint",
]

[tasks."ansible:testlab:inventory"]
description = "show the ansible inventory for tofu/testlab, sourced live from tofu state"
dir = "{{config_root}}/ansible"
run = "ansible-inventory --graph"

[tasks."ansible:testlab:ping"]
description = "ping all tofu/testlab hosts over ssh"
dir = "{{config_root}}/ansible"
run = "ansible-playbook playbooks/ping.yml"

[tasks."ansible:testlab:ubuntu-upgrade"]
description = "full-upgrade apt packages on all tofu/testlab hosts, rebooting if required"
dir = "{{config_root}}/ansible"
run = "ansible-playbook playbooks/ubuntu_upgrade.yml"

[tasks."ansible:testlab:k3s-install"]
description = "provision k3s on all tofu/testlab hosts (k3s-io/k3s-ansible)"
dir = "{{config_root}}/ansible"
env = { ANSIBLE_FORKS = "1" }
run = "ansible-playbook playbooks/k3s_install.yml"

[tasks."ansible:testlab:k3s-uninstall"]
description = "de-provision k3s on all tofu/testlab hosts (k3s-io/k3s-ansible)"
dir = "{{config_root}}/ansible"
run = "ansible-playbook playbooks/k3s_uninstall.yml"

[tasks."kubernetes:testlab:apply"]
description = "apply kubernetes manifests to the tofu/testlab k3s cluster"
dir = "{{config_root}}/kubernetes"
run = "kubectl apply -k testlab"

[tasks."kubernetes:testlab:diff"]
description = "diff kubernetes manifests against the tofu/testlab k3s cluster"
dir = "{{config_root}}/kubernetes"
run = "kubectl diff -k testlab"

[tasks."kubernetes:testlab:delete"]
description = "delete kubernetes manifests from the tofu/testlab k3s cluster"
dir = "{{config_root}}/kubernetes"
run = "kubectl delete -k testlab"

[tasks."kubernetes:yamllint"]
description = "check kubernetes yaml formatting with yamllint"
dir = "{{config_root}}/kubernetes"
run = "yamllint ."

[tasks."kubernetes:testlab:validate"]
description = "validate rendered kubernetes manifests for tofu/testlab against the k8s schema"
dir = "{{config_root}}/kubernetes"
run = "kubectl kustomize testlab | kubeconform -strict -kubernetes-version 1.36.0 -summary"

[tasks."kubernetes:check"]
description = "check formatting and validity of kubernetes manifests"
depends = [
  "kubernetes:yamllint",
  "kubernetes:testlab:validate",
]

[tasks."tofu:lab:backend"]
description = "render backend.hcl for tofu/lab from 1Password"
dir = "{{config_root}}/tofu/lab"
run = "op inject -i backend.hcl.tpl -o backend.hcl"

[tasks."tofu:lab:init"]
description = "tofu init for tofu/lab, wiring up the s3 backend config"
dir = "{{config_root}}/tofu/lab"
depends = [
  "tofu:lab:backend",
]
run = "tofu init -backend-config=backend.hcl"

[tasks."tofu:lab:plan"]
description = "tofu plan for tofu/lab"
dir = "{{config_root}}/tofu/lab"
run = "tofu plan"

[tasks."tofu:lab:apply"]
description = "tofu apply for tofu/lab"
dir = "{{config_root}}/tofu/lab"
run = "tofu apply"

[tasks."tofu:lab:validate"]
description = "validate tofu/lab config"
dir = "{{config_root}}/tofu/lab"
run = "tofu validate"

[tasks."tofu:lab:check"]
description = "check formatting and validity of tofu/lab configs"
depends = [
  "tofu:lab:validate",
]

[tasks."tofu:testlab:backend"]
description = "render backend.hcl for tofu/testlab from 1Password"
dir = "{{config_root}}/tofu/testlab"
env = { _.file = "{{config_root}}/tofu/testlab/.env" }
run = "op inject -i backend.hcl.tpl -o backend.hcl"

[tasks."tofu:testlab:init"]
description = "tofu init for tofu/testlab, wiring up the s3 backend config"
dir = "{{config_root}}/tofu/testlab"
env = { _.file = "{{config_root}}/tofu/testlab/.env" }
depends = [
  "tofu:testlab:backend",
]
run = "tofu init -backend-config=backend.hcl"

[tasks."tofu:testlab:plan"]
description = "tofu plan for tofu/testlab"
dir = "{{config_root}}/tofu/testlab"
env = { _.file = "{{config_root}}/tofu/testlab/.env" }
run = "tofu plan"

[tasks."tofu:testlab:apply"]
description = "tofu apply for tofu/testlab"
dir = "{{config_root}}/tofu/testlab"
env = { _.file = "{{config_root}}/tofu/testlab/.env" }
run = "tofu apply"

[tasks."tofu:testlab:validate"]
description = "validate tofu/testlab config"
dir = "{{config_root}}/tofu/testlab"
env = { _.file = "{{config_root}}/tofu/testlab/.env" }
run = "tofu validate"

[tasks."tofu:testlab:check"]
description = "check formatting and validity of tofu/testlab configs"
depends = [
  "tofu:testlab:validate",
]

[tasks."tofu:fmt"]
description = "check formatting and modify files for all tofu configs"
dir = "{{config_root}}/tofu"
run = "tofu fmt -diff -recursive"

[tasks."tofu:fmt-check"]
description = "check formatting of all tofu configs without modifying files"
dir = "{{config_root}}/tofu"
run = "tofu fmt -check -diff -recursive"

[tasks."tofu:check"]
description = "check formatting and validity of all tofu configs"
depends = [
  "tofu:fmt-check",
  "tofu:lab:check",
  "tofu:testlab:check",
]
