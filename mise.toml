[env]
_.file = ".env"

[tools]
# runtimes
node = "lts"

# infra provisioning
opentofu = "1.12"
talosctl = "latest"

# kubernetes
kubectl = "1.36"
kubeconform = "latest"
helm = "3"
helmfile = "latest"
flux2 = "latest"
k9s = "latest"

# secrets
1password-cli = "latest"

# ansible
python = "3"
pipx = "latest"
"pipx:ansible" = { version = "14", pipx_args = "--include-deps" }
"pipx:ansible-lint" = "26"

# misc
yq = "latest"

# formatting
"npm:prettier" = "latest"
"aqua:pre-commit/pre-commit" = "latest"
shellcheck = "latest"

[tasks."op:whoami"]
description = "test that OP_SERVICE_ACCOUNT_TOKEN auth works"
run = "op whoami"

[tasks."op:read"]
description = "read a secret from 1Password, e.g. mise run op:read -- op://vault/item/field"
run = "op read"

[tasks."ssh:add-key"]
description = "load the 1Password management ssh key into ssh-agent"
run = "op read 'op://Home Network/theforce - management ssh key/private key?ssh-format=openssh' | ssh-add -"

[tasks."hooks:install"]
description = "install the pre-commit git hook"
run = "pre-commit install"

[tasks."ansible:install-collections"]
description = "install ansible collections required by ansible/requirements.yml"
dir = "{{config_root}}/ansible"
run = "ansible-galaxy collection install -r requirements.yml"

[tasks."ansible:lint"]
description = "lint ansible playbooks and roles with ansible-lint"
dir = "{{config_root}}/ansible"
run = "ansible-lint"

[tasks."ansible:check"]
description = "check formatting and validity of ansible playbooks and roles"
depends = [
  "ansible:lint",
]

[tasks."ansible:testlab:inventory"]
description = "show the ansible inventory for tofu/testlab, sourced live from tofu state — empty today (testlab runs Talos, which has no ansible_host resources); kept for any future Ubuntu-based project"
dir = "{{config_root}}/ansible"
run = "ansible-inventory --graph"

[tasks."ansible:testlab:ping"]
description = "ping all tofu/testlab hosts over ssh — no live hosts today (testlab runs Talos, which has no SSH); kept for any future Ubuntu-based project"
dir = "{{config_root}}/ansible"
run = "ansible-playbook playbooks/ping.yml"

[tasks."ansible:testlab:ubuntu-upgrade"]
description = "full-upgrade apt packages on all tofu/testlab hosts, rebooting if required — no live hosts today (testlab runs Talos, which has no SSH); kept for any future Ubuntu-based project"
dir = "{{config_root}}/ansible"
run = "ansible-playbook playbooks/ubuntu_upgrade.yml"

[tasks."talos:testlab:kubeconfig"]
description = "write the testlab Talos cluster kubeconfig to tofu/testlab/.cache/kubeconfig.yaml from tofu state"
dir = "{{config_root}}/tofu/testlab"
env = { _.file = "{{config_root}}/tofu/testlab/.env" }
run = "mkdir -p .cache && tofu output -raw talos_kubeconfig > .cache/kubeconfig.yaml"

[tasks."talos:testlab:talosconfig"]
description = "write the testlab talosconfig (talosctl client config) to tofu/testlab/.cache/talosconfig from tofu state"
dir = "{{config_root}}/tofu/testlab"
env = { _.file = "{{config_root}}/tofu/testlab/.env" }
run = "mkdir -p .cache && tofu output -raw talos_config > .cache/talosconfig"

[tasks."k9s:testlab"]
description = "launch k9s against the testlab cluster kubeconfig"
depends = ["talos:testlab:kubeconfig"]
env = { KUBECONFIG = "{{config_root}}/tofu/testlab/.cache/kubeconfig.yaml" }
run = "k9s"

[tasks."kubernetes:testlab:bootstrap"]
description = "one-time bootstrap of the testlab cluster: ESO's 1Password service account secret, the MetalLB reserved-IP ConfigMap, then flux-operator + flux-instance via helmfile — Flux takes over reconciling everything else in apps/ from here on"
dir = "{{config_root}}/kubernetes/testlab/bootstrap/flux"
depends = ["talos:testlab:kubeconfig"]
env = { KUBECONFIG = "{{config_root}}/tofu/testlab/.cache/kubeconfig.yaml" }
run = [
  # ESO's own 1Password service account token — chicken-and-egg, since ESO
  # isn't running yet to manage this secret itself.
  "kubectl create namespace security-system --dry-run=client -o yaml | kubectl apply -f -",
  "kubectl create secret generic onepassword-service-account-token --from-literal=token=\"$(op item get '1Password Service Account Auth Token: testlab k8s eso' --vault 'Home Network' --fields label=credential --reveal)\" -n security-system --dry-run=client -o yaml | kubectl apply -f -",

  # MetalLB's reserved LB IP, as the ConfigMap Flux substitutes into
  # IPAddressPool — safe to re-run any time the reserved IP changes.
  "kubectl create namespace metallb-system --dry-run=client -o yaml | kubectl apply -f -",
  "kubectl create configmap metallb-config --from-literal=LB_IP=\"$(tofu -chdir={{config_root}}/tofu/testlab output -raw k8s_lb_ip)/32\" -n metallb-system --dry-run=client -o yaml | kubectl apply -f -",

  # Installs flux-operator and a FluxInstance — Flux owns reconciliation of
  # everything else in kubernetes/testlab/ from here on.
  "helmfile sync",
]

[tasks."kubernetes:testlab:flux-status"]
description = "show the reconciliation status of every Flux Kustomization/HelmRelease in the testlab cluster"
env = { KUBECONFIG = "{{config_root}}/tofu/testlab/.cache/kubeconfig.yaml" }
run = [
  "flux get kustomizations -A",
  "flux get helmreleases -A",
]

[tasks."kubernetes:testlab:flux-sync"]
description = "force Flux to pull the latest git commit and reconcile every Kustomization in the testlab cluster now, instead of waiting for the next scheduled interval"
env = { KUBECONFIG = "{{config_root}}/tofu/testlab/.cache/kubeconfig.yaml" }
run = [
  "flux reconcile source git flux-system",
  "flux reconcile kustomization flux-system --with-source",
]

[tasks."kubernetes:testlab:validate"]
description = "validate rendered testlab kustomize output (Flux Kustomization/HelmRelease/HelmRepository/OCIRepository CRs — Flux's helm-controller inflates the actual chart output in-cluster, not here) against the k8s schema"
dir = "{{config_root}}/kubernetes/testlab"
run = "kubectl kustomize . | kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.36.0 -summary -schema-location default -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{% raw %}{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}{% endraw %}.json'"

[tasks."kubernetes:check"]
description = "check formatting and validity of kubernetes manifests"
depends = [
  "kubernetes:testlab:validate",
]

[tasks."tofu:lab:backend"]
description = "render backend.hcl for tofu/lab from 1Password"
dir = "{{config_root}}/tofu/lab"
run = "op inject -i backend.hcl.tpl -o backend.hcl"

[tasks."tofu:lab:init"]
description = "tofu init for tofu/lab, wiring up the s3 backend config"
dir = "{{config_root}}/tofu/lab"
depends = [
  "tofu:lab:backend",
]
run = "tofu init -backend-config=backend.hcl"

[tasks."tofu:lab:plan"]
description = "tofu plan for tofu/lab"
dir = "{{config_root}}/tofu/lab"
run = "tofu plan"

[tasks."tofu:lab:apply"]
description = "tofu apply for tofu/lab"
dir = "{{config_root}}/tofu/lab"
run = "tofu apply -auto-approve"

[tasks."tofu:lab:destroy"]
description = "tofu apply for tofu/lab"
dir = "{{config_root}}/tofu/lab"
run = "tofu apply -destroy"

[tasks."tofu:lab:validate"]
description = "validate tofu/lab config"
dir = "{{config_root}}/tofu/lab"
run = "tofu validate"

[tasks."tofu:lab:check"]
description = "check formatting and validity of tofu/lab configs"
depends = [
  "tofu:lab:validate",
]

[tasks."tofu:testlab:backend"]
description = "render backend.hcl for tofu/testlab from 1Password"
dir = "{{config_root}}/tofu/testlab"
env = { _.file = "{{config_root}}/tofu/testlab/.env" }
run = "op inject -i backend.hcl.tpl -o backend.hcl"

[tasks."tofu:testlab:init"]
description = "tofu init for tofu/testlab, wiring up the s3 backend config"
dir = "{{config_root}}/tofu/testlab"
env = { _.file = "{{config_root}}/tofu/testlab/.env" }
depends = [
  "tofu:testlab:backend",
]
run = "tofu init -backend-config=backend.hcl"

[tasks."tofu:testlab:plan"]
description = "tofu plan for tofu/testlab"
dir = "{{config_root}}/tofu/testlab"
env = { _.file = "{{config_root}}/tofu/testlab/.env" }
run = "tofu plan"

[tasks."tofu:testlab:apply"]
description = "tofu apply for tofu/testlab"
dir = "{{config_root}}/tofu/testlab"
env = { _.file = "{{config_root}}/tofu/testlab/.env" }
run = "tofu apply"

[tasks."tofu:testlab:clear-leases"]
description = "clear stale OPNsense/Kea DHCP leases for testlab's statically-provisioned IPs (Kea doesn't release a lease just because its reservation was destroyed — see tofu/testlab/main.tf)"
dir = "{{config_root}}/tofu/testlab"
env = { _.file = "{{config_root}}/tofu/testlab/.env" }
run = [
  '''
  OPNSENSE_URL=$(grep -E '^opnsense_endpoint' terraform.tfvars | cut -d'"' -f2) \
  OPNSENSE_ALLOW_INSECURE=$(grep -E '^opnsense_allow_insecure' terraform.tfvars | awk '{print $NF}') \
  OPNSENSE_USERNAME=$(op item get 'OPNsense- tofu' --vault 'Home Network' --fields label=username --reveal) \
  OPNSENSE_PASSWORD=$(op item get 'OPNsense- tofu' --vault 'Home Network' --fields label=password --reveal) \
  ../../scripts/opnsense-clear-dhcp-leases.sh \
    $(tofu output -raw talos_apiserver_vip) \
    $(tofu output -raw k8s_lb_ip) \
    $(tofu output -json vm_network_info | jq -r '.[].ip_address')
  ''',
]

[tasks."tofu:testlab:destroy"]
description = "clear stale DHCP leases for testlab's static IPs, then tofu destroy tofu/testlab"
dir = "{{config_root}}/tofu/testlab"
env = { _.file = "{{config_root}}/tofu/testlab/.env" }
depends = ["tofu:testlab:clear-leases"]
run = "tofu apply -destroy -auto-approve"

[tasks."tofu:testlab:validate"]
description = "validate tofu/testlab config"
dir = "{{config_root}}/tofu/testlab"
env = { _.file = "{{config_root}}/tofu/testlab/.env" }
run = "tofu validate"

[tasks."tofu:testlab:check"]
description = "check formatting and validity of tofu/testlab configs"
depends = [
  "tofu:testlab:validate",
]

[tasks."tofu:fmt"]
description = "check formatting and modify files for all tofu configs"
dir = "{{config_root}}/tofu"
run = "tofu fmt -diff -recursive"

[tasks."tofu:fmt-check"]
description = "check formatting of all tofu configs without modifying files"
dir = "{{config_root}}/tofu"
run = "tofu fmt -check -diff -recursive"

[tasks."tofu:check"]
description = "check formatting and validity of all tofu configs"
depends = [
  "tofu:fmt-check",
  "tofu:lab:check",
  "tofu:testlab:check",
]

[tasks."volsync:testlab:backup"]
description = "trigger a manual volsync backup for an app in testlab, e.g. mise run volsync:testlab:backup -- pihole default"
env = { KUBECONFIG = "{{config_root}}/tofu/testlab/.cache/kubeconfig.yaml" }
run = "./scripts/volsync-backup.sh"

[tasks."volsync:testlab:backup-all"]
description = "trigger a manual volsync backup for every app in testlab (optionally scoped to one namespace), e.g. mise run volsync:testlab:backup-all -- default"
env = { KUBECONFIG = "{{config_root}}/tofu/testlab/.cache/kubeconfig.yaml" }
run = "./scripts/volsync-backup-all.sh"

[tasks."volsync:testlab:restore"]
description = "trigger a volsync restore for an app in testlab — requires a ReplicationDestination named <app>-dst (not yet wired up in kubernetes/testlab/components/volsync/)"
env = { KUBECONFIG = "{{config_root}}/tofu/testlab/.cache/kubeconfig.yaml" }
run = "./scripts/volsync-restore.sh"

[tasks."volsync:testlab:snapshots"]
description = "list available restic snapshots for an app in testlab, e.g. mise run volsync:testlab:snapshots -- pihole default"
env = { KUBECONFIG = "{{config_root}}/tofu/testlab/.cache/kubeconfig.yaml" }
run = "./scripts/volsync-snapshots.sh"

[tasks."volsync:testlab:unlock"]
description = "remove a stale restic lock left by a killed volsync mover pod in testlab, e.g. mise run volsync:testlab:unlock -- default"
env = { KUBECONFIG = "{{config_root}}/tofu/testlab/.cache/kubeconfig.yaml" }
run = "./scripts/volsync-unlock.sh"

[tasks."format:prettier"]
description = "format all yaml, markdown, and json files with prettier"
run = "prettier --write ."

[tasks."format:prettier-check"]
description = "check yaml, markdown, and json formatting without modifying files"
run = "prettier --check ."
