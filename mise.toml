[env]
_.file = ".env"

[tools]
opentofu = "1.12"
node = "lts"
kubectl = "1.36"
kubeconform = "latest"
talosctl = "latest"
helm = "3"
helmfile = "latest"
yq = "latest"
1password-cli = "latest"
python = "3"
pipx = "latest"
"pipx:ansible" = { version = "14", pipx_args = "--include-deps" }
"pipx:ansible-lint" = "26"
"pipx:yamllint" = "latest"
"pipx:mdformat" = { version = "1.0.0", pipx_args = "--preinstall mdformat-gfm==1.0.0" }
"pipx:pre-commit" = "latest"
k9s = "latest"

[tasks."op:whoami"]
description = "test that OP_SERVICE_ACCOUNT_TOKEN auth works"
run = "op whoami"

[tasks."op:read"]
description = "read a secret from 1Password, e.g. mise run op:read -- op://vault/item/field"
run = "op read"

[tasks."ssh:add-key"]
description = "load the 1Password management ssh key into ssh-agent"
run = "op read 'op://Home Network/theforce - management ssh key/private key?ssh-format=openssh' | ssh-add -"

[tasks."hooks:install"]
description = "install the pre-commit git hook"
run = "pre-commit install"

[tasks."ansible:install-collections"]
description = "install ansible collections required by ansible/requirements.yml"
dir = "{{config_root}}/ansible"
run = "ansible-galaxy collection install -r requirements.yml"

[tasks."ansible:lint"]
description = "lint ansible playbooks and roles with ansible-lint"
dir = "{{config_root}}/ansible"
run = "ansible-lint"

[tasks."ansible:yamllint"]
description = "check ansible yaml formatting with yamllint"
dir = "{{config_root}}/ansible"
run = "yamllint ."

[tasks."ansible:check"]
description = "check formatting and validity of ansible playbooks and roles"
depends = [
  "ansible:yamllint",
  "ansible:lint",
]

[tasks."ansible:testlab:inventory"]
description = "show the ansible inventory for tofu/testlab, sourced live from tofu state — empty today (testlab runs Talos, which has no ansible_host resources); kept for any future Ubuntu-based project"
dir = "{{config_root}}/ansible"
run = "ansible-inventory --graph"

[tasks."ansible:testlab:ping"]
description = "ping all tofu/testlab hosts over ssh — no live hosts today (testlab runs Talos, which has no SSH); kept for any future Ubuntu-based project"
dir = "{{config_root}}/ansible"
run = "ansible-playbook playbooks/ping.yml"

[tasks."ansible:testlab:ubuntu-upgrade"]
description = "full-upgrade apt packages on all tofu/testlab hosts, rebooting if required — no live hosts today (testlab runs Talos, which has no SSH); kept for any future Ubuntu-based project"
dir = "{{config_root}}/ansible"
run = "ansible-playbook playbooks/ubuntu_upgrade.yml"

[tasks."talos:testlab:kubeconfig"]
description = "write the testlab Talos cluster kubeconfig to tofu/testlab/.cache/kubeconfig.yaml from tofu state"
dir = "{{config_root}}/tofu/testlab"
env = { _.file = "{{config_root}}/tofu/testlab/.env" }
run = "mkdir -p .cache && tofu output -raw talos_kubeconfig > .cache/kubeconfig.yaml"

[tasks."talos:testlab:talosconfig"]
description = "write the testlab talosconfig (talosctl client config) to tofu/testlab/.cache/talosconfig from tofu state"
dir = "{{config_root}}/tofu/testlab"
env = { _.file = "{{config_root}}/tofu/testlab/.env" }
run = "mkdir -p .cache && tofu output -raw talos_config > .cache/talosconfig"

[tasks."k9s:testlab"]
description = "launch k9s against the testlab cluster kubeconfig"
depends = ["talos:testlab:kubeconfig"]
env = { KUBECONFIG = "{{config_root}}/tofu/testlab/.cache/kubeconfig.yaml" }
run = "k9s"

[tasks."kubernetes:testlab:render-metallb-config"]
description = "render the MetalLB LB IP (from tofu/testlab's k3s_lb_ip output) into apps/metallb-system/lb.env if it hasn't been rendered yet — delete the file first to force a re-render after the reserved IP changes"
dir = "{{config_root}}/tofu/testlab"
env = { _.file = "{{config_root}}/tofu/testlab/.env" }
run = "test -f {{config_root}}/kubernetes/testlab/apps/metallb-system/lb.env || echo \"LB_IP=$(tofu output -raw k3s_lb_ip)/32\" > {{config_root}}/kubernetes/testlab/apps/metallb-system/lb.env"

[tasks."kubernetes:testlab:apply-volumesnapshot-crds"]
description = "apply the snapshot.storage.k8s.io CRDs VolSync's controller requires at startup (crashloops without them, even though this repo never uses copyMethod: Snapshot) — via bootstrap/crds/apply-volumesnapshot-crds.sh — must run before apply-crds"
dir = "{{config_root}}/kubernetes/testlab/bootstrap/crds"
env = { KUBECONFIG = "{{config_root}}/tofu/testlab/.cache/kubeconfig.yaml" }
run = "./apply-volumesnapshot-crds.sh"

[tasks."kubernetes:testlab:apply-crds"]
description = "extract and apply CRDs bundled in testlab helm charts, stamped with Helm ownership metadata so helmfile sync can adopt them — via bootstrap/crds/apply.sh — must run before apply-charts and apply-manifests"
dir = "{{config_root}}/kubernetes/testlab/bootstrap/crds"
depends = ["kubernetes:testlab:apply-volumesnapshot-crds"]
env = { KUBECONFIG = "{{config_root}}/tofu/testlab/.cache/kubeconfig.yaml" }
run = "./apply.sh"

[tasks."kubernetes:testlab:apply-charts"]
description = "sync all testlab helm chart releases via helmfile"
dir = "{{config_root}}/kubernetes/testlab"
depends = ["kubernetes:testlab:render-metallb-config", "kubernetes:testlab:apply-crds"]
env = { KUBECONFIG = "{{config_root}}/tofu/testlab/.cache/kubeconfig.yaml" }
run = "helmfile sync"

[tasks."kubernetes:testlab:wait-eso-webhook"]
description = "wait for the External Secrets webhook to be ready — apply-manifests' ClusterSecretStore create fails if it races ahead of this on a fresh install"
env = { KUBECONFIG = "{{config_root}}/tofu/testlab/.cache/kubeconfig.yaml" }
run = "kubectl wait pod -n security-system -l app.kubernetes.io/name=external-secrets-webhook --for=condition=Ready --timeout=90s"

[tasks."kubernetes:testlab:wait-metallb-webhook"]
description = "wait for the MetalLB controller (which also serves its validating webhook) to be ready — apply-manifests' IPAddressPool/L2Advertisement create fails if it races ahead of this on a fresh install"
env = { KUBECONFIG = "{{config_root}}/tofu/testlab/.cache/kubeconfig.yaml" }
run = "kubectl wait pod -n metallb-system -l app.kubernetes.io/component=controller --for=condition=Ready --timeout=90s"

[tasks."kubernetes:testlab:apply-manifests"]
description = "apply testlab raw kubernetes manifests (namespaces, CRs, routes) via kustomize, retrying on transient webhook-not-ready errors — see apply-testlab-manifests.sh"
dir = "{{config_root}}/kubernetes"
depends = ["kubernetes:testlab:wait-eso-webhook", "kubernetes:testlab:wait-metallb-webhook"]
env = { KUBECONFIG = "{{config_root}}/tofu/testlab/.cache/kubeconfig.yaml" }
run = "./apply-testlab-manifests.sh"

[tasks."kubernetes:testlab:apply"]
description = "apply the full testlab stack: CRDs, then helm chart releases, then raw manifests"
depends = ["kubernetes:testlab:apply-charts"]
depends_post = ["kubernetes:testlab:apply-manifests"]
run = "true"

[tasks."kubernetes:testlab:diff"]
description = "diff testlab helm chart releases and raw manifests against the cluster"
dir = "{{config_root}}/kubernetes/testlab"
depends = ["kubernetes:testlab:render-metallb-config"]
env = { KUBECONFIG = "{{config_root}}/tofu/testlab/.cache/kubeconfig.yaml" }
run = [
  "helmfile diff",
  "kubectl diff -k {{config_root}}/kubernetes/testlab",
]

[tasks."kubernetes:testlab:bootstrap"]
description = "one-time bootstrap of secrets that can't be managed in-cluster yet — currently ESO's own 1Password service account token into the security-system namespace (chicken-and-egg: ESO isn't running yet to manage this itself)"
env = { KUBECONFIG = "{{config_root}}/tofu/testlab/.cache/kubeconfig.yaml" }
run = [
  "kubectl create namespace security-system --dry-run=client -o yaml | kubectl apply -f -",
  "kubectl create secret generic onepassword-service-account-token --from-literal=token=\"$(op item get '1Password Service Account Auth Token: testlab k8s eso' --vault 'Home Network' --fields label=credential --reveal)\" -n security-system --dry-run=client -o yaml | kubectl apply -f -",
]

[tasks."kubernetes:testlab:delete"]
description = "delete testlab helm chart releases and raw manifests from the cluster — does NOT remove CRDs, see kubernetes:testlab:delete-crds"
dir = "{{config_root}}/kubernetes/testlab"
env = { KUBECONFIG = "{{config_root}}/tofu/testlab/.cache/kubeconfig.yaml" }
run = [
  "helmfile destroy",
  # kubectl delete -k testlab (unfiltered) always fails on `default`: it's
  # declared in apps/default/namespace.yaml so `apply -k` can reconcile it,
  # but k8s refuses to ever delete the default namespace. Filter it out so
  # this task exits cleanly instead of erroring on the very last resource.
  "kubectl kustomize {{config_root}}/kubernetes/testlab | yq ea 'select(.kind != \"Namespace\" or .metadata.name != \"default\")' - | kubectl delete --ignore-not-found -f -",
]

[tasks."kubernetes:testlab:delete-crds"]
description = "delete all CRDs bundled by testlab helm charts (see bootstrap/crds/helmfile.yaml) — cascade-deletes every custom resource of that kind cluster-wide, run only for a full from-nothing retry, never as routine teardown"
dir = "{{config_root}}/kubernetes/testlab/bootstrap/crds"
env = { KUBECONFIG = "{{config_root}}/tofu/testlab/.cache/kubeconfig.yaml" }
run = "./delete.sh"

[tasks."kubernetes:testlab:delete-volumesnapshot-crds"]
description = "delete the snapshot.storage.k8s.io CRDs applied by apply-volumesnapshot-crds — cascade-deletes every VolumeSnapshot cluster-wide, run only for a full from-nothing retry, never as routine teardown"
dir = "{{config_root}}/kubernetes/testlab/bootstrap/crds"
env = { KUBECONFIG = "{{config_root}}/tofu/testlab/.cache/kubeconfig.yaml" }
run = "./delete-volumesnapshot-crds.sh"

[tasks."kubernetes:yamllint"]
description = "check kubernetes yaml formatting with yamllint"
dir = "{{config_root}}/kubernetes"
run = "yamllint ."

[tasks."kubernetes:testlab:validate"]
description = "validate rendered testlab helm chart and kustomize output against the k8s schema"
dir = "{{config_root}}/kubernetes/testlab"
depends = ["kubernetes:testlab:render-metallb-config"]
run = [
  "helmfile template | kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.36.0 -summary -schema-location default -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{% raw %}{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}{% endraw %}.json'",
  "kubectl kustomize {{config_root}}/kubernetes/testlab | kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.36.0 -summary -schema-location default -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{% raw %}{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}{% endraw %}.json'",
]

[tasks."kubernetes:check"]
description = "check formatting and validity of kubernetes manifests"
depends = [
  "kubernetes:yamllint",
  "kubernetes:testlab:validate",
]

[tasks."tofu:lab:backend"]
description = "render backend.hcl for tofu/lab from 1Password"
dir = "{{config_root}}/tofu/lab"
run = "op inject -i backend.hcl.tpl -o backend.hcl"

[tasks."tofu:lab:init"]
description = "tofu init for tofu/lab, wiring up the s3 backend config"
dir = "{{config_root}}/tofu/lab"
depends = [
  "tofu:lab:backend",
]
run = "tofu init -backend-config=backend.hcl"

[tasks."tofu:lab:plan"]
description = "tofu plan for tofu/lab"
dir = "{{config_root}}/tofu/lab"
run = "tofu plan"

[tasks."tofu:lab:apply"]
description = "tofu apply for tofu/lab"
dir = "{{config_root}}/tofu/lab"
run = "tofu apply"

[tasks."tofu:lab:validate"]
description = "validate tofu/lab config"
dir = "{{config_root}}/tofu/lab"
run = "tofu validate"

[tasks."tofu:lab:check"]
description = "check formatting and validity of tofu/lab configs"
depends = [
  "tofu:lab:validate",
]

[tasks."tofu:testlab:backend"]
description = "render backend.hcl for tofu/testlab from 1Password"
dir = "{{config_root}}/tofu/testlab"
env = { _.file = "{{config_root}}/tofu/testlab/.env" }
run = "op inject -i backend.hcl.tpl -o backend.hcl"

[tasks."tofu:testlab:init"]
description = "tofu init for tofu/testlab, wiring up the s3 backend config"
dir = "{{config_root}}/tofu/testlab"
env = { _.file = "{{config_root}}/tofu/testlab/.env" }
depends = [
  "tofu:testlab:backend",
]
run = "tofu init -backend-config=backend.hcl"

[tasks."tofu:testlab:plan"]
description = "tofu plan for tofu/testlab"
dir = "{{config_root}}/tofu/testlab"
env = { _.file = "{{config_root}}/tofu/testlab/.env" }
run = "tofu plan"

[tasks."tofu:testlab:apply"]
description = "tofu apply for tofu/testlab"
dir = "{{config_root}}/tofu/testlab"
env = { _.file = "{{config_root}}/tofu/testlab/.env" }
run = "tofu apply"

[tasks."tofu:testlab:validate"]
description = "validate tofu/testlab config"
dir = "{{config_root}}/tofu/testlab"
env = { _.file = "{{config_root}}/tofu/testlab/.env" }
run = "tofu validate"

[tasks."tofu:testlab:check"]
description = "check formatting and validity of tofu/testlab configs"
depends = [
  "tofu:testlab:validate",
]

[tasks."tofu:fmt"]
description = "check formatting and modify files for all tofu configs"
dir = "{{config_root}}/tofu"
run = "tofu fmt -diff -recursive"

[tasks."tofu:fmt-check"]
description = "check formatting of all tofu configs without modifying files"
dir = "{{config_root}}/tofu"
run = "tofu fmt -check -diff -recursive"

[tasks."tofu:check"]
description = "check formatting and validity of all tofu configs"
depends = [
  "tofu:fmt-check",
  "tofu:lab:check",
  "tofu:testlab:check",
]

[tasks."markdown:fmt"]
description = "format all markdown files with mdformat"
run = "mdformat --exclude '**/.terraform/**' --exclude '**/charts/**' --exclude '**/.claude/**' ."

[tasks."markdown:fmt-check"]
description = "check markdown formatting without modifying files"
run = "mdformat --exclude '**/.terraform/**' --exclude '**/charts/**' --exclude '**/.claude/**' --check ."
