# nginx-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
    name: nginx
spec:
    replicas: 6
    selector:
        matchLabels:
            app: nginx
    template:
        metadata:
            labels:
                app: nginx
        spec:
            containers:
                - name: nginx
                  image: nginx:alpine
                  ports:
                      - containerPort: 80
                  command: ["/bin/sh", "-c"]
                  args:
                      - |
                          echo "Pod: $(hostname). Served from this pod in the k3s cluster" > /usr/share/nginx/html/index.html
                          nginx -g 'daemon off;'
---
apiVersion: v1
kind: Service
metadata:
    name: nginx
spec:
    type: NodePort
    selector:
        app: nginx
    ports:
        - port: 80
          targetPort: 80
          nodePort: 30080
