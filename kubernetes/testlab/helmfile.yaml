repositories:
  - name: traefik
    url: https://traefik.github.io/charts
  - name: local-path-provisioner
    url: https://charts.containeroo.ch
  - name: metallb
    url: https://metallb.github.io/metallb
  - name: csi-driver-nfs
    url: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
  - name: external-secrets
    url: https://charts.external-secrets.io
  - name: volsync
    url: https://backube.github.io/helm-charts/
  # TrueCharts (pihole, snapdrop) are referenced directly via their OCI ref
  # in releases[].chart below — no repository entry needed for OCI charts.

releases:
  # k3s bundled Traefik + local-path-provisioner as built-in add-ons; Talos
  # runs vanilla Kubernetes, so both become real releases here instead.
  - name: traefik
    namespace: kube-system
    chart: traefik/traefik
    version: 34.0.0
    values:
      - apps/kube-system/traefik/app/values.yaml

  - name: local-path-provisioner
    namespace: kube-system
    chart: local-path-provisioner/local-path-provisioner
    version: 0.0.31
    values:
      - apps/kube-system/local-path-provisioner/app/values.yaml

  - name: metallb
    namespace: metallb-system
    chart: metallb/metallb
    version: 0.16.1
    values:
      - apps/metallb-system/metallb/app/values.yaml

  - name: csi-driver-nfs
    namespace: storage-system
    chart: csi-driver-nfs/csi-driver-nfs
    version: 4.13.4
    values:
      - apps/storage-system/csi-driver-nfs/app/values.yaml

  - name: volsync
    namespace: storage-system
    chart: volsync/volsync
    version: 0.16.0
    values:
      - apps/storage-system/volsync/app/values.yaml

  - name: external-secrets
    namespace: security-system
    chart: external-secrets/external-secrets
    version: 2.8.0
    values:
      - apps/security-system/external-secrets/app/values.yaml

  - name: pihole
    namespace: default
    chart: oci://oci.trueforge.org/truecharts/pihole
    version: 22.11.0
    values:
      - apps/default/pihole/app/values.yaml

  - name: snapdrop
    namespace: default
    chart: oci://oci.trueforge.org/truecharts/snapdrop
    version: 13.7.0
    values:
      - apps/default/snapdrop/app/values.yaml
