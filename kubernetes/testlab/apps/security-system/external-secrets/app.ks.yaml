---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
spec:
  interval: 10m
  prune: true
  wait: true
  timeout: 5m
  targetNamespace: security-system

  path: ./kubernetes/testlab/apps/security-system/external-secrets/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
