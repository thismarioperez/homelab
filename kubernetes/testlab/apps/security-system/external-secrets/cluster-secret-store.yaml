# References a Kubernetes Secret containing a 1Password Service Account
# token, created out-of-band before ESO can resolve any ExternalSecret —
# same manual-bootstrap pattern the old 1Password Connect setup used.
#
#   kubectl create secret generic onepassword-service-account-token \
#     --namespace security-system \
#     --from-literal=token=<service account token>
#
# The Service Account must be scoped to the "Home Network" vault (see
# docs/workstation-setup.md) and named with "testlab" in it per this
# cluster's 1Password naming convention.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  provider:
    onepasswordSDK:
      vault: Home Network
      auth:
        serviceAccountSecretRef:
          name: onepassword-service-account-token
          key: token
          namespace: security-system
