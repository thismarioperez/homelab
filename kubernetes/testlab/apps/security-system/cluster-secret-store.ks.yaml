---
# Split out from the external-secrets Kustomization so it isn't applied
# alongside the HelmRelease that installs ESO itself: the ClusterSecretStore's
# validating webhook isn't up on first reconcile, so a combined apply fails
# and only self-heals on the next 10m retry.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-secret-store
spec:
  interval: 10m
  prune: true
  wait: true
  timeout: 5m
  targetNamespace: security-system

  path: ./kubernetes/testlab/apps/security-system/cluster-secret-store
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  dependsOn:
    - name: external-secrets
      namespace: security-system
