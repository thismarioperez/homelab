---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
spec:
  interval: 30m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: longhorn
      version: 1.9.1
      sourceRef:
        kind: HelmRepository
        name: longhorn

  values:
    persistence:
      defaultClass: true
      defaultClassReplicaCount: 1

    defaultSettings:
      # in-cluster replication is redundant with off-cluster restic/B2
      # backups — see components/volsync's restic ReplicationSource.
      defaultReplicaCount: 1
      # NFS-backed nfs-backups StorageClass remains for anything that
      # still wants it; Longhorn only needs local node disk.
      createDefaultDiskLabeledNodes: true

    # Talos labels controllers with node-role.kubernetes.io/control-plane
    # but applies no positive label to workers, so "worker" is expressed as
    # anti-affinity to that label rather than a nodeSelector — avoids a
    # separate node-labeling step outside this chart.
    longhornManager:
      affinity: &notControlPlaneAffinity
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist

    longhornDriver:
      affinity: *notControlPlaneAffinity

    csi:
      attacher:
        affinity: *notControlPlaneAffinity
      provisioner:
        affinity: *notControlPlaneAffinity
      resizer:
        affinity: *notControlPlaneAffinity
      snapshotter:
        affinity: *notControlPlaneAffinity
