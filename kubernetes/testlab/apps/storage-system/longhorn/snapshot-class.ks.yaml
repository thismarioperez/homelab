---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-snapshot-class
spec:
  interval: 10m
  prune: true
  wait: true
  timeout: 5m
  targetNamespace: storage-system

  path: ./kubernetes/testlab/apps/storage-system/longhorn/snapshot-class
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  dependsOn:
    - name: longhorn
      namespace: storage-system
