---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: csi-driver-nfs
spec:
  interval: 10m
  prune: true
  wait: true
  timeout: 5m
  targetNamespace: storage-system

  path: ./kubernetes/testlab/apps/storage-system/csi-driver-nfs/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
