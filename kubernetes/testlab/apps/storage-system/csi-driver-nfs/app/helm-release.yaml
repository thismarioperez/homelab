---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-nfs
spec:
  interval: 30m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: csi-driver-nfs
      version: 4.13.4
      sourceRef:
        kind: HelmRepository
        name: csi-driver-nfs

  values:
    storageClass:
      create: true
      name: nfs-backups
      parameters:
        server: 10.30.10.4
        share: /volume1/kubernetes/testlab/backups
      reclaimPolicy: Retain
      volumeBindingMode: Immediate
