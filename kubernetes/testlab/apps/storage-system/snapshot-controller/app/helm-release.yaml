---
# Neither csi-driver-nfs nor Longhorn ship the Kubernetes-side
# snapshot-controller or VolumeSnapshot* CRDs — those are cluster-scoped
# infrastructure the CSI spec assumes exists independently. Without this,
# VolumeSnapshot objects (created by volsync's restic mover via
# copyMethod: Snapshot) are never reconciled into VolumeSnapshotContent,
# and Longhorn's driver.longhorn.io CreateSnapshot call never fires.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
spec:
  interval: 30m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: snapshot-controller
      version: 4.1.0
      sourceRef:
        kind: HelmRepository
        name: snapshot-controller
