apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: volsync-restic-secret
spec:
  # 1Password item must define fields named RESTIC_PASSWORD and
  # RESTIC_REPOSITORY (field labels become secret keys verbatim) — repo
  # path is a filesystem path on the NFS-backed PVC mounted by the restic
  # mover, e.g. /repository.
  itemPath: "vaults/Home Network/items/testlab - VolSync - restic repo password"
