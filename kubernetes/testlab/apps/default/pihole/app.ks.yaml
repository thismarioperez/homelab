---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pihole
spec:
  interval: 10m
  prune: true
  wait: true
  timeout: 5m
  targetNamespace: default

  path: ./kubernetes/testlab/apps/default/pihole/app
  components:
    - ../../../../components/volsync/
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  postBuild:
    substitute:
      APP: pihole
      VOLSYNC_NAMESPACE: default
      VOLSYNC_PVC: pihole-config
      VOLSYNC_CAPACITY: 4Gi
      # pihole's data dir mixes ownership: most files are pihole:pihole
      # (568:568), but a few (e.g. /etc/pihole/logrotate) are root:root
      # mode 0640, written before the container drops privileges. No
      # single non-root UID/GID can read both, so the mover runs as root.
      VOLSYNC_PUID: "0"
      VOLSYNC_PGID: "0"

  dependsOn:
    - name: gateway
      namespace: kube-system
    - name: volsync
      namespace: storage-system
