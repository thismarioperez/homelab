apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - replicationsource.yaml

helmCharts:
  - name: pihole
    repo: oci://oci.trueforge.org/truecharts
    version: 22.11.0
    releaseName: pihole
    namespace: default
    valuesInline:
      # Throwaway instance for testing Longhorn data replication/failover —
      # not used for real DNS. No ingress/HTTPRoute; UI reachable at
      # <node-ip>:30980.
      service:
        main:
          type: NodePort
          ports:
            main:
              nodePort: 30980
      # PVCs are backed up by VolSync — see replicationsource.yaml.
      persistence:
        config:
          size: 4Gi
        dnsmasq:
          size: 1Gi
