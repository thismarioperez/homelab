apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: pihole-config-restore
  namespace: default
spec:
  rsync:
    # Destination is the SSH server; VolSync auto-generates the SSH keypair
    # Secret here (see .status.rsync.sshKeys) — the ReplicationSource must
    # be pointed at that same Secret and at .status.rsync.address.
    copyMethod: Direct
    accessModes: ["ReadWriteOnce"]
    # Matches pihole-config's own size (apps/default/pihole/app/values.yaml
    # persistence.config.size) — this is a mirror of that PVC, not a distinct
    # capacity decision.
    capacity: 4Gi
    storageClassName: nfs-backups
    serviceType: ClusterIP
  # No trigger: the rsync mover's Destination keeps its SSH server pod
  # running continuously by default (per VolSync's own rsync docs) — it's
  # a listener, not a periodic job. The ReplicationSource's schedule is
  # what drives each sync. A trigger.manual here (as the generic
  # examples/replicationdestination.yaml uses) is only correct for a true
  # one-off restore, since VolSync tears the listener down between manual
  # syncs once lastManualSync catches up — which silently breaks the
  # Source's scheduled pushes.
