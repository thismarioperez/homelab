apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: pihole-config-backup
  namespace: default
spec:
  sourcePVC: pihole-config
  trigger:
    # Pihole config changes rarely (DNS records, blocklists) — daily is
    # plenty and keeps the backup window off peak query hours.
    schedule: "0 3 * * *"
  rsync:
    # Plain rsync (not rsync-tls): same-cluster, same-VLAN NFS traffic never
    # leaves trusted network segments, so TLS adds cost without a real threat
    # model it defends against here.
    copyMethod: Direct
    # address/sshKeys read verbatim from pihole-config-restore's status
    # after it reconciled (see replicationdestination.yaml):
    #   kubectl get replicationdestination/pihole-config-restore -n default \
    #     -o jsonpath='{.status.rsync.address}'
    # VolSync's Service name is volsync-rsync-dst-<name>, not <name> itself
    # (the examples/ file's placeholder assumed the latter) — use the
    # cluster-DNS form of that real Service name rather than the bare
    # ClusterIP so this survives Service recreation.
    address: volsync-rsync-dst-pihole-config-restore.default.svc.cluster.local
    sshKeys: volsync-rsync-dst-src-pihole-config-restore
