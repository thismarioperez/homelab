apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vaultwarden

resources:
  - namespace.yaml

helmCharts:
  - name: vaultwarden
    repo: oci://oci.trueforge.org/truecharts
    version: 30.9.1
    releaseName: vaultwarden
    namespace: vaultwarden
    valuesInline:
      # This chart requires ingress.main to be enabled (hard validation
      # failure otherwise), unlike snapdrop/paperless-ngx which route
      # through a hand-written Gateway API HTTPRoute. Using the chart's own
      # Ingress here instead of fighting that requirement — Traefik still
      # serves plain Ingress objects alongside Gateway API.
      ingress:
        main:
          enabled: true
          ingressClassName: traefik
          hosts:
            - host: vaultwarden.testlab.theforce.lan
              paths:
                - path: /
                  pathType: Prefix
      # No CloudNativePG operator installed in this cluster — use
      # vaultwarden's sqlite backend instead, rather than adding a Postgres
      # operator.
      cnpg:
        main:
          enabled: false
      database:
        type: sqlite
      persistence:
        data:
          size: 2Gi
      # Chart-managed placeholder Secret: DATABASE_URL defaults to a
      # secretKeyRef against a cnpg-created Secret that doesn't exist since
      # cnpg is disabled above. Points at a real sqlite URL instead.
      secret:
        vaultwarden-db-placeholder:
          enabled: true
          expandObjectName: false
          data:
            url: "sqlite:///data/db.sqlite3"
      workload:
        main:
          podSpec:
            containers:
              main:
                env:
                  DATABASE_URL:
                    secretKeyRef:
                      # secretKeyRef name-expansion is independent of the
                      # secret's own expandObjectName above — without this,
                      # the env lookup auto-prefixes to
                      # "vaultwarden-vaultwarden-db-placeholder" and fails.
                      expandObjectName: false
                      name: vaultwarden-db-placeholder
                      key: url
