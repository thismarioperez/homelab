---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb
spec:
  interval: 10m
  prune: true
  wait: true
  timeout: 5m
  targetNamespace: metallb-system

  path: ./kubernetes/testlab/apps/metallb-system/metallb/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
