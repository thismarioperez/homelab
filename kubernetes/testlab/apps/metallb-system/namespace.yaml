apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system
  labels:
    # metallb-speaker/frr-k8s need hostNetwork, NET_ADMIN/NET_RAW/SYS_ADMIN,
    # and hostPorts — Talos's default PodSecurity admission config enforces
    # `baseline` on namespaces with no explicit level, which forbids all of
    # that.
    pod-security.kubernetes.io/enforce: privileged
