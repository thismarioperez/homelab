---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb-config
spec:
  interval: 10m
  prune: true
  wait: true
  timeout: 5m
  targetNamespace: metallb-system

  path: ./kubernetes/testlab/apps/metallb-system/config
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: metallb-config

  dependsOn:
    - name: metallb
