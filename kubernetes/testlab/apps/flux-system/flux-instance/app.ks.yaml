---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-instance
spec:
  interval: 1h
  prune: false # Never delete this — it's what keeps Flux itself running.
  wait: false
  targetNamespace: flux-system

  path: ./kubernetes/testlab/apps/flux-system/flux-instance/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
