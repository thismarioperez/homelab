apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: longhorn-system

resources:
  - namespace.yaml
  - httproute.yaml

helmCharts:
  - name: longhorn
    repo: https://charts.longhorn.io
    version: 1.12.0
    releaseName: longhorn
    namespace: longhorn-system
    valuesInline:
      defaultSettings:
        defaultReplicaCount: 1
      persistence:
        defaultClass: true
      defaultBackupStore:
        # Longhorn's CSI VolumeSnapshot implementation refuses to finalize
        # any snapshot without a configured backup target, even when only
        # used as VolSync's ephemeral staging step (copyMethod: Snapshot)
        # rather than for Longhorn's own remote backups. This seeds a
        # BackupTarget CR named "default" in longhorn-system on install
        # (kubectl get backuptargets.longhorn.io -n longhorn-system).
        # Points at a separate subdir from VolSync's own restic repo on
        # the same NAS to avoid the two writing into the same path.
        backupTarget: "nfs://10.30.10.4:/volume1/kubernetes/testlab/longhorn-backup-target"
