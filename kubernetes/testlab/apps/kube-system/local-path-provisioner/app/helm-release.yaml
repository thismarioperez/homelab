---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-path-provisioner
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: local-path-provisioner
      version: 0.0.31
      sourceRef:
        kind: HelmRepository
        name: local-path-provisioner

  values:
    # Default general-purpose StorageClass (Talos ships no default StorageClass).
    storageClass:
      defaultClass: true
