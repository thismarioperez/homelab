# Applied directly via the Kubernetes API (kubectl apply), not file-dropped
# into k3s's manifests directory — k3s's internal helm-controller watches
# HelmChartConfig objects cluster-wide regardless of how they got created.
# Enabling the Gateway provider here is also what causes k3s's bundled
# Traefik chart to install the Gateway API standard-channel CRDs itself; no
# separate CRD install step is needed (nothing goes in bootstrap/crds for
# this).
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    providers:
      kubernetesGateway:
        enabled: true
    # We hand-author our own Gateway (see gateway.yaml) rather than use the
    # chart's opinionated default one, so it stays disabled here;
    # gatewayClass stays on so Traefik still owns its GatewayClass.
    gateway:
      enabled: false
    gatewayClass:
      enabled: true
