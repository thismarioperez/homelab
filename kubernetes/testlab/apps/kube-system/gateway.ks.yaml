---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway
spec:
  interval: 10m
  prune: true
  wait: true
  timeout: 5m
  targetNamespace: kube-system

  path: ./kubernetes/testlab/apps/kube-system/gateway
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  dependsOn:
    - name: traefik
      namespace: kube-system
