repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: tofu-fmt-check
        name: tofu fmt-check
        entry: mise run tofu:fmt-check
        language: system
        files: ^tofu/.*\.tf$
        pass_filenames: false

      - id: ansible-check
        name: ansible check (ansible-lint)
        entry: mise run ansible:check
        language: system
        files: ^ansible/
        pass_filenames: false

      - id: prettier-check
        name: prettier check
        entry: mise run format:prettier-check
        language: system
        files: \.(ya?ml|md|json)$
        pass_filenames: false
